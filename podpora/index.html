<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora</title>
    <!-- Tailwind CSS pro rychlý a moderní vzhled -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Technická podpora</h1>
        
        <!-- Formulář s ID požadovaným tvým skriptem -->
        <form id="question-form" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Jméno</label>
                <input type="text" id="name" name="name" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Jan Novák">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                <!-- ID "email" odpovídá tvému script.js -->
                <input type="email" id="email" name="email"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="jan.novak@example.com">
            </div>

            <div>
                <label for="question" class="block text-sm font-medium text-slate-700 mb-1">Dotaz</label>
                <!-- ID "question" odpovídá tvému script.js -->
                <textarea id="question" name="question" rows="4" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Popište svůj problém..."></textarea>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                Odeslat dotaz
            </button>
        </form>

        <!-- Místo pro odpověď, kam tvůj script zapisuje výsledky -->
        <div id="answer" class="mt-6 text-sm text-slate-600 whitespace-pre-line"></div>
    </div>

    <!-- Propojení s tvým externím script.js -->
    <script src="script.js"></script>
</body>
</html>
